<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IPO Hub</title>
<meta name="theme-color" content="#0A2E66">
<meta name="description" content="Apply for IPOs from all your MeroShare accounts, track allotment and your portfolio">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IPO Hub">
<link rel="preload" href="fonts/archivo.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Archivo";src:url(fonts/archivo.woff2) format("woff2");font-weight:100 900;font-stretch:62% 125%;font-display:swap}
:root{
  --ink:#0A2E66;--blue:#0C4DA1;--red:#ED1B24;--green:#0F8A4F;--amber:#B45309;
  --bg:#EEF1F6;--surface:#FFFFFF;--line:#DCE2EC;--text:#13213A;--muted:#5E6B80;--faint:#E6EBF3;
  --blue-t:#E3ECFA;--red-t:#FDE7E8;--green-t:#E1F4EA;--amber-t:#FDF0DC;
  --hero-text:#FFFFFF;--hero-muted:#AFC3E6;
  --r-group:14px;--r-sheet:22px;
  --tabh:64px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --ink:#0A1A38;--blue:#6E9CF2;--red:#FF5C62;--green:#3FCF8A;--amber:#F2B45A;
    --bg:#0B1424;--surface:#142038;--line:#22314F;--text:#E6ECF5;--muted:#8C9AB3;--faint:#1B2944;
    --blue-t:#1C2E52;--red-t:#3A1C26;--green-t:#163528;--amber-t:#3A2C17;
    --hero-muted:#8EA6D3;
    color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.45;font-variation-settings:"wdth" 100;overscroll-behavior-y:contain}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums;font-variation-settings:"wdth" 82}
.up{color:var(--green)}.dn{color:var(--red)}.mu{color:var(--muted)}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 24px)}

/* ---------- app bar ---------- */
.appbar{background:var(--ink);color:var(--hero-text);padding:calc(env(safe-area-inset-top) + 10px) 16px 14px}
.barrow{display:flex;align-items:center;gap:8px;min-height:40px}
.barrow h1{flex:1;margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}
.ib{width:40px;height:40px;border:0;border-radius:12px;background:transparent;color:inherit;display:grid;place-items:center}
.ib:active{background:rgba(255,255,255,.12)}
.ib svg{width:22px;height:22px}
.ib.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sub{color:var(--hero-muted);font-size:13px;margin-top:2px}
.offline{background:var(--amber-t);color:var(--amber);font-size:13px;padding:7px 16px;text-align:center}

/* ---------- portfolio hero ---------- */
.hero{margin-top:10px}
.hero .v{font-size:40px;line-height:1.05;font-weight:700;font-variation-settings:"wdth" 72;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.hero .v small{font-size:20px;font-weight:600;color:var(--hero-muted);margin-right:4px}
.hero .chg{margin-top:6px;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.hero .chg.up{color:#5FE3A1}.hero .chg.dn{color:#FF8A8E}
.hero .meta{display:flex;gap:18px;margin-top:12px;font-size:13px;color:var(--hero-muted)}
.hero .meta b{display:block;color:var(--hero-text);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;font-variation-settings:"wdth" 82}
.hero .meta b.up{color:#5FE3A1}.hero .meta b.dn{color:#FF8A8E}
.spark{display:block;width:100%;height:64px;margin-top:12px}
.spark-l{display:flex;justify-content:space-between;font-size:11px;color:var(--hero-muted);font-variant-numeric:tabular-nums}

/* ---------- layout ---------- */
main{padding:14px 14px 0}
.sec{font-size:13px;font-weight:600;color:var(--muted);margin:20px 4px 7px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sec:first-child{margin-top:4px}
.sec .lnk{border:0;background:none;color:var(--blue);font-size:13px;font-weight:600;padding:2px 4px}
.group{background:var(--surface);border-radius:var(--r-group);overflow:hidden;border:1px solid var(--line)}
@media (prefers-color-scheme:light){.group{border-color:transparent;box-shadow:0 0 0 1px var(--line)}}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:56px;position:relative;width:100%;text-align:left;border:0;background:none}
.row+.row{border-top:1px solid var(--line)}
button.row:active,label.row:active{background:var(--faint)}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .end{text-align:right;flex-shrink:0}
.row .end .t{font-variant-numeric:tabular-nums;font-variation-settings:"wdth" 82}
.row .chev{width:16px;height:16px;color:var(--muted);flex-shrink:0}
.row.dis{opacity:.5}
.ghead{padding:14px 14px 10px;border-bottom:1px solid var(--line)}
.ghead h2{margin:0;font-size:17px;font-weight:700;line-height:1.25}
.ghead .s{font-size:13px;color:var(--muted);margin-top:3px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.gfoot{padding:12px 14px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}

/* avatar */
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;flex-shrink:0;font-variation-settings:"wdth" 90}

/* chips & pills */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:2px 14px 2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;color:var(--text)}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
@media (prefers-color-scheme:dark){.chip[aria-pressed="true"]{color:#0B1424}}
.chip .n{opacity:.7;margin-left:4px;font-variant-numeric:tabular-nums}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.p-g{background:var(--green-t);color:var(--green)}.p-r{background:var(--red-t);color:var(--red)}
.p-a{background:var(--amber-t);color:var(--amber)}.p-b{background:var(--blue-t);color:var(--blue)}.p-n{background:var(--faint);color:var(--muted)}

/* buttons */
.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:700;font-size:15px;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.full{width:100%}
.btn-red{background:var(--red);color:#fff}
.btn-blue{background:var(--blue);color:#fff}
@media (prefers-color-scheme:dark){.btn-blue{color:#0B1424}}
.btn-soft{background:var(--blue-t);color:var(--blue)}
.btn-plain{background:var(--faint);color:var(--text)}
.btn[disabled]{opacity:.45;cursor:default}
.btn svg{width:18px;height:18px}
.sbtn{text-decoration:none;border:0;background:var(--blue-t);color:var(--blue);border-radius:9px;padding:6px 11px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.sbtn svg{width:15px;height:15px}

/* check circle */
.ck{appearance:none;-webkit-appearance:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);margin:0;flex-shrink:0;display:grid;place-items:center;background:var(--surface)}
.ck:checked{background:var(--blue);border-color:var(--blue)}
.ck:checked::after{content:"";width:10px;height:6px;border:2.5px solid #fff;border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
@media (prefers-color-scheme:dark){.ck:checked::after{border-color:#0B1424}}
.ck:disabled{background:var(--faint)}

/* stepper */
.step{display:flex;align-items:center;background:var(--faint);border-radius:12px;overflow:hidden}
.step button{border:0;background:none;width:42px;height:44px;font-size:20px;font-weight:600;color:var(--blue)}
.step span{min-width:96px;text-align:center;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}

/* inputs */
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:5px}
.field input,.field select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:12px 13px;font-size:16px;outline:none}
.field input:focus{border-color:var(--blue)}
.field small{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}

/* switch */
.sw{position:relative;width:50px;height:30px;flex-shrink:0}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw i{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:background .2s}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.sw input:checked+i{background:var(--green)}
.sw input:checked+i::after{transform:translateX(20px)}

/* stats */
.stats{display:grid;grid-template-columns:1fr 1fr}
.stat{padding:13px 14px}
.stat:nth-child(odd){border-right:1px solid var(--line)}
.stat:nth-child(n+3){border-top:1px solid var(--line)}
.stat .v{font-size:24px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;font-variation-settings:"wdth" 78}
.stat .l{font-size:13px;color:var(--muted);margin-top:2px}
.sbar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--faint);margin-top:6px}
.sbar i{display:block;height:100%}
.donut-wrap{display:flex;align-items:center;gap:18px;padding:16px 14px}
.legend{display:grid;gap:8px;font-size:14px;flex:1}
.legend div{display:flex;align-items:center;gap:8px}
.legend b{font-variant-numeric:tabular-nums;margin-left:auto;font-weight:700}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* notices */
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-group);font-size:14px;margin-bottom:10px}
.note svg{width:18px;height:18px;flex-shrink:0;margin-top:1px}
.note.warn{background:var(--amber-t);color:var(--amber)}
.note.err{background:var(--red-t);color:var(--red)}
.note.info{background:var(--blue-t);color:var(--blue)}
.note .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.empty{text-align:center;padding:42px 20px;color:var(--muted)}
.empty h3{color:var(--text);margin:0 0 6px;font-size:17px}
.empty p{margin:0 0 16px}

/* skeleton */
.sk{background:var(--faint);border-radius:7px;height:12px;position:relative;overflow:hidden}
.sk::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);animation:sh 1.2s infinite}
@media (prefers-color-scheme:dark){.sk::after{background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent)}}
@keyframes sh{to{transform:translateX(100%)}}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tabh)}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted)}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--blue)}
.tab[aria-current="page"] .ico{background:var(--blue-t);border-radius:99px}
.tab .ico{display:grid;place-items:center;width:56px;height:30px;transition:background .2s}

/* pull to refresh */
.ptr{height:0;overflow:hidden;display:grid;place-items:center;color:var(--muted);font-size:13px;transition:height .2s}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet-wrap[hidden]{display:none}
.scrim{position:absolute;inset:0;background:rgba(6,14,30,.5);opacity:0;transition:opacity .22s}
.sheet{position:relative;width:100%;max-width:560px;max-height:88vh;overflow:auto;background:var(--bg);border-radius:var(--r-sheet) var(--r-sheet) 0 0;
  padding:8px 16px calc(16px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1)}
.sheet-wrap.open .scrim{opacity:1}.sheet-wrap.open .sheet{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.sheet h2{margin:0 0 4px;font-size:20px;font-weight:700}
.sheet .lead{color:var(--muted);margin:0 0 14px;font-size:14px}
.sheet .acts{display:flex;gap:10px;margin-top:16px}
.sheet .acts .btn{flex:1}
.sheet .serr{color:var(--red);font-size:14px;margin-top:10px;min-height:1px}
.kv .row{min-height:46px;padding:10px 14px}
.kv .row .k{flex:1;color:var(--muted);font-size:14px}
.kv .row .val{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}

/* toast */
.toasts{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 12px);z-index:60;display:grid;justify-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{background:#13213A;color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;font-weight:600;max-width:520px;box-shadow:0 6px 24px rgba(0,0,0,.25);
  transform:translateY(12px);opacity:0;transition:all .22s}
@media (prefers-color-scheme:dark){.toast{background:#E6ECF5;color:#0B1424}}
.toast.show{transform:none;opacity:1}
.toast.err{background:var(--red);color:#fff}

/* login */
.login{min-height:100vh;background:var(--ink);color:#fff;display:flex;flex-direction:column;justify-content:center;padding:calc(env(safe-area-inset-top) + 24px) 24px 40px}
.login .box{max-width:400px;width:100%;margin:0 auto}
.login img{width:64px;height:64px;border-radius:16px}
.login h1{font-size:30px;margin:18px 0 6px;font-weight:700;font-variation-settings:"wdth" 88}
.login p{color:var(--hero-muted);margin:0 0 24px}
.login input{width:100%;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;border-radius:12px;padding:14px;font-size:17px;outline:none}
.login input::placeholder{color:var(--hero-muted)}
.login input:focus{border-color:#fff}
.login details{margin:14px 0 18px;color:var(--hero-muted);font-size:13px}
.login details input{font-size:13px;padding:10px;margin-top:8px}
.login .msg{min-height:22px;margin-top:12px;font-size:14px;color:#FF8A8E}
.login .btn-red{width:100%}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (min-width:600px){.app{padding-top:0}}
</style>
</head>
<body>
<div id="root"></div>
<div class="sheet-wrap" id="sheet" hidden><div class="scrim"></div><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetBody"></div></div></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script>
/* ================= icons ================= */
const I=(p,extra='')=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ${extra}>${p}</svg>`;
const IC={
  apply:I('<path d="M12 5v14M5 12h14"/><rect x="3" y="3" width="18" height="18" rx="5"/>'),
  results:I('<path d="M9 11l2.2 2.2L15.5 9"/><path d="M5 4h14v16l-3-2-2 2-2-2-2 2-2-2-3 2z"/>'),
  stats:I('<path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/>'),
  portfolio:I('<path d="M3 17l5-5 4 4 8-8"/><path d="M15 8h5v5"/>'),
  accounts:I('<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.5a3.3 3.3 0 0 1 0 6.4M18 14.8c1.9.7 3.1 2.4 3.5 5.2"/>'),
  refresh:I('<path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/>'),
  chev:I('<path d="M9 6l6 6-6 6"/>'),
  copy:I('<rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>'),
  ext:I('<path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M19 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h4"/>'),
  plus:I('<path d="M12 5v14M5 12h14"/>'),
  info:I('<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>'),
  warn:I('<path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17h.01"/>'),
  lock:I('<rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>'),
  download:I('<path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/>'),
  sheet:I('<rect x="4" y="4" width="16" height="16" rx="2.5"/><path d="M4 10h16M10 4v16"/>'),
  camera:I('<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>')
};

/* ================= transport ================= */
const DEFAULT_API='https://script.google.com/macros/s/AKfycbzDHBHyDzpZoTzg8AU0bddZJvRRmtJSBsNG6tK2_Hsg5_jIopyKCMBssCywzvqJbM0hGQ/exec';
const APP_VERSION='2.0.3';
const CDSC_URL='https://iporesult.cdsc.com.np/';
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let API=LS.get('ipohub_api')||DEFAULT_API,PASS=LS.get('ipohub_pass')||'';
if(/Hsg5_jlopyK/.test(API)){API=DEFAULT_API;LS.set('ipohub_api',API)}
class AuthError extends Error{}
async function rpc(fn,args){
  if(!navigator.onLine)throw new Error('You are offline. Connect to the internet and try again.');
  let r;
  try{r=await fetch(API,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({pass:PASS,fn:fn,args:args})})}
  catch(e){throw new Error('Could not reach your Apps Script. Check the deployment is set to "Anyone" and the URL ends in /exec.')}
  const t=await r.text();let j;
  try{j=JSON.parse(t)}catch(e){throw new Error('Apps Script did not return data (HTTP '+r.status+'). Most likely the deployment access is not "Anyone", or a new version was not deployed.')}
  if(!j.ok){if(/passcode/i.test(j.error||''))throw new AuthError(j.error);throw new Error(j.error||'Unknown error')}
  return j.data}
let CUR=0;
const READ=new Set(['listAccounts','getIssues','getPortfolio','getSettings','getHistory','getWacc']);
/* read-only calls from a screen you already left are dropped, so a slow screen never overwrites the one you opened */
const run=(fn,...a)=>{const gen=CUR;return new Promise((res,rej)=>rpc(fn,a).then(v=>{if(READ.has(fn)&&gen!==CUR)return;res(v)},e=>{if(READ.has(fn)&&gen!==CUR)return;rej(e)}))};
const runNG=(fn,...a)=>rpc(fn,a);
const all=(fn,...a)=>Promise.all(ACC.map(async x=>({label:x.label,...await run(fn,x.label,...a)})));
const allNG=(fn,...a)=>Promise.all(ACC.map(async x=>({label:x.label,...await runNG(fn,x.label,...a)})));
const some=(labels,fn,...a)=>Promise.all(labels.map(async l=>({label:l,...await runNG(fn,l,...a)})));

/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>n==null||n===''||isNaN(+n)?'–':Number(n).toLocaleString('en-IN',{maximumFractionDigits:2});
const rs=n=>n==null?'–':'Rs '+fmt(n);
const sg=n=>n==null?'–':(n>0?'+':n<0?'−':'')+fmt(Math.abs(n));

const HUES=[[214,62],[262,45],[174,52],[24,70],[330,48],[140,40]];
function av(label){let h=0;for(const c of String(label))h=(h*31+c.charCodeAt(0))>>>0;const [hu,sa]=HUES[h%HUES.length];

const sk=(w,h=12)=>`<div class="sk" style="width:${w};height:${h}px"></div>`;

/* ================= toast & sheet ================= */
function toast(msg,kind){const t=document.createElement('div');t.className='toast'+(kind==='err'?' err':'');t.textContent=msg;$('#toasts').appendChild(t);
  requestAnimationFrame(()=>t.classList.add('show'));setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),300)},kind==='err'?4500:2600)}
let SHEET=null;
function sheet({title,lead,body='',actions=[{label:'Close'}]}){
  return new Promise(resolve=>{
    const w=$('#sheet');
    $('#sheetBody').innerHTML=`${title?`<h2>${esc(title)}</h2>`:''}${lead?`<p class="lead">${lead}</p>`:''}${body}<div class="serr" id="serr"></div>
      ${actions.length?`<div class="acts">${actions.map((a,i)=>`<button class="btn ${a.kind||'btn-plain'}" data-i="${i}">${a.label}</button>`).join('')}</div>`:''}`;
    w.hidden=false;requestAnimationFrame(()=>w.classList.add('open'));
    const close=v=>{w.classList.remove('open');SHEET=null;setTimeout(()=>{if(!SHEET)w.hidden=true},260);resolve(v)};
    SHEET={close};
    w.querySelector('.scrim').onclick=()=>close(null);
    $('#sheetBody').querySelectorAll('.acts button[data-i]').forEach(b=>b.onclick=async()=>{
      const a=actions[+b.dataset.i];
      if(a.fn){const lbl=b.innerHTML;b.disabled=true;b.textContent=a.busy||'Working…';$('#serr').textContent='';
        try{const v=await a.fn();if(v===undefined){b.disabled=false;b.innerHTML=lbl;return}close(v)}
        catch(e){b.disabled=false;b.innerHTML=lbl;$('#serr').textContent=e.message}}
      else close(a.value===undefined?null:a.value)});
    const f=$('#sheetBody').querySelector('input:not([type=checkbox])');if(f)setTimeout(()=>f.focus(),280);
  })}

function shell(){

function setBar(title,sub,hero){$('#title').textContent=title;$('#sub').innerHTML=sub||'';$('#hero').innerHTML=hero||''}
function sw(k){if(k===TAB){window.scrollTo({top:0,behavior:'smooth'});return}TAB=k;LS.set('ipohub_tab',k);window.scrollTo(0,0);go()}
function spin(on){const b=$('#rf');if(b)b.classList.toggle('spin',on)}

async function go(){
  CUR++;const my=CUR;
  if(!PASS){login();return}
  if(!$('#m'))shell();
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-current',b.dataset.t===TAB?'page':'false'));
  const T=TABS.find(t=>t[0]===TAB);setBar(T[0]==='ipo'?'Apply IPO':T[1],'','');
  const hasCache=(TAB==='res'||TAB==='dash')?VIEW:CACHE[TAB];
  if(!hasCache)$('#m').innerHTML=TAB==='pf'?`<div style="height:6px"></div>${skeleton(5)}`:skeleton(4);
  spin(true);
  try{
    if(!ACC_T||Date.now()-ACC_T>300000){ACC=await run('listAccounts');ACC_T=Date.now()}
    if(my!==CUR)return;
    if(FACC!=='all'&&!ACC.some(a=>a.label===FACC))FACC='all';
    await ({ipo:scrApply,res:scrResults,dash:scrStats,pf:scrPortfolio,acc:scrAccounts}[TAB])(my);
  }catch(e){
    if(my!==CUR)return;
    if(e instanceof AuthError){PASS='';LS.del('ipohub_pass');login(e.message);return}
    $('#m').innerHTML=note('err',esc(e.message),`<button class="sbtn" onclick="refresh()">${IC.refresh}Try again</button>`);
  }finally{if(my===CUR)spin(false)}}

  if(days<0)return['Closed','p-n'];if(days===0)return['Closes today','p-r'];if(days===1)return['Closes tomorrow','p-a'];return['Closes in '+days+' days','p-b']}

      ${anyCan?`<div class="row" style="min-height:44px;padding:8px 14px"><div class="main s" id="sel_${i.id}"></div><button class="sbtn" onclick="selAll(${i.id})" id="sa_${i.id}">Select all</button></div>`:''}
      ${rows}

async function rawSheet(id){const i=ISSUES[id];if(!i)return;

async function applySel(id){

function loadView(force){
  if(!force&&VIEW&&Date.now()-VIEW_T<120000)return Promise.resolve(VIEW);

  const p=VIEW_P=(async()=>{const per=await allNG('getResults');const v=await runNG('buildView',per);VIEW=v;VIEW_T=Date.now();return v})();

function donut(a,n,p){const t=a+n+p,R=42,C=2*Math.PI*R;let off=0;
  const seg=(v,col)=>{if(!v)return '';const len=v/t*C,s=`<circle r="${R}" cx="55" cy="55" fill="none" stroke="${col}" stroke-width="14" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 55 55)"/>`;off+=len;return s};
  const rate=a+n?Math.round(a/(a+n)*100):0;

function pagg(rows){let c=0,v=0,n=0;rows.forEach(x=>{if(x.cost!=null&&x.value!=null){c+=x.cost;v+=x.value;n++}});return{cost:c,value:v,pnl:v-c,pct:c?(v-c)/c*100:null,n:n,total:rows.length}}

function spark(h){
  if(h.length<2)return `<div class="spark-l" style="margin-top:12px"><span>Value history builds up from daily snapshots.</span></div>`;
  const W=320,H=64,P=3,vals=h.map(x=>x.total),min=Math.min(...vals),max=Math.max(...vals),rng=(max-min)||1;
  const xy=h.map((x,i)=>[P+i*(W-2*P)/(h.length-1),H-P-(x.total-min)/rng*(H-2*P)]);
  const line=xy.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const up=vals[vals.length-1]>=vals[0],col=up?'#5FE3A1':'#FF8A8E';
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    <polygon points="${P},${H} ${line} ${W-P},${H}" fill="${col}" opacity=".14"/><polyline points="${line}" fill="none" stroke="${col}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>
    <div class="spark-l"><span>${esc(h[0].date)}</span><span>${plural(h.length,'day')}</span><span>${esc(h[h.length-1].date)}</span></div>`}

    return{...x,acct:a.label,wacc:w,cost:cost,pnl:cost!=null&&x.value!=null?x.value-cost:null}})}));

    s.qty+=x.qty||0;s.value+=x.value||0;s.prevValue+=x.prevValue==null?(x.value||0):x.prevValue;s.accts.push(x);
    if(x.cost!=null&&x.value!=null){s.cq+=x.qty;s.cc+=x.cost;s.cv+=x.value;s.cn++}});
  const list=Object.values(S).map(s=>({...s,chg:s.value-s.prevValue,dpct:s.prevValue?(s.value-s.prevValue)/s.prevValue*100:null,wacc:s.cq?s.cc/s.cq:null,pnl:s.cq?s.cv-s.cc:null,ret:s.cc?(s.cv-s.cc)/s.cc*100:null,partial:s.cn<s.accts.length}));
  return {A,sel,rowsAll,list,T:agg(rowsAll),P:pagg(rowsAll),HASPREV:rowsAll.some(x=>x.prevValue!=null)}}

    const v=await sheet({title:'Result alerts',lead:'You get one email when a result is out for an IPO you applied to, and a summary once every account’s result is known.',
      body:`<label class="field"><span>Email address</span><input id="al_e" type="email" inputmode="email" value="${esc(st.email)}" placeholder="you@gmail.com"></label>`,
      actions:[{label:'Cancel'},{label:'Turn on',kind:'btn-blue',busy:'Turning on…',fn:async()=>{const e=$('#al_e').value.trim();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)){sheetErr('Enter a valid email address.');return}await runNG('enableAlerts',e);return e}}]});
    if(v){CACHE.acc.st={email:v,enabled:true};toast('Alerts on. A test email is on its way.');renderAcc()}}
  else{cb.disabled=true;try{await runNG('disableAlerts');CACHE.acc.st={...st,enabled:false};toast('Alerts off');renderAcc()}catch(e){cb.checked=true;cb.disabled=false;toast(e.message,'err')}}}

/* ================= lock / login ================= */
function login(msg){
  CUR++;
  $('#root').innerHTML=`<div class="login"><div class="box"><img src="icons/icon-192.png" alt="">
   <h1>IPO Hub</h1><p>Enter the passcode you set in your Google Sheet, under IPO Hub, Set / change app passcode.</p>
   <input id="lg_p" type="password" placeholder="App passcode" autocomplete="current-password" aria-label="App passcode">
   <details><summary>Apps Script address</summary><input id="lg_u" value="${esc(API)}" aria-label="Apps Script URL"></details>
   <button class="btn btn-red" id="lg_b" onclick="doLogin()">Unlock</button><div class="msg" id="lg_msg">${msg?esc(msg):''}</div></div></div>`;
  const p=$('#lg_p');setTimeout(()=>p.focus(),50);p.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()})}
async function doLogin(){
  const p=$('#lg_p').value.trim(),u=$('#lg_u').value.trim()||DEFAULT_API;if(!p){$('#lg_msg').textContent='Enter your passcode.';return}
  const b=$('#lg_b');b.disabled=true;b.textContent='Unlocking…';$('#lg_msg').textContent='';PASS=p;API=u;
  try{ACC=await rpc('listAccounts',[]);ACC_T=Date.now();LS.set('ipohub_pass',p);LS.set('ipohub_api',u);shell();go()}
  catch(e){PASS='';b.disabled=false;b.textContent='Unlock';vib(60);
    const net=!(e instanceof AuthError)&&!/passcode/i.test(e.message);
    $('#lg_msg').innerHTML=esc(e.message)+(net?`<br><a href="${esc(u+(u.includes('?')?'&':'?')+'ping=1')}" target="_blank" rel="noopener" style="color:#fff">Test the connection</a> <span style="color:var(--hero-muted)">should show "ok":true without asking you to sign in.</span>`:'')}}
async function logout(){const ok=await sheet({title:'Lock IPO Hub?',lead:'You’ll need the passcode to open it again on this phone.',actions:[{label:'Cancel'},{label:'Lock',kind:'btn-red',value:true}]});
  if(!ok)return;PASS='';LS.del('ipohub_pass');VIEW=null;for(const k in CACHE)delete CACHE[k];ACC=[];ACC_T=0;login()}

/* ================= install, offline, pull to refresh ================= */
const STANDALONE=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
function installEnv(){const ua=navigator.userAgent;
  if(location.protocol==='file:')return 'file';
  if(/FBAN|FBAV|Messenger|Viber|Instagram|Line\/|; wv\)/.test(ua))return 'inapp';
  if(/iPhone|iPad|iPod/.test(ua))return 'ios';
  if(/SamsungBrowser/.test(ua))return 'samsung';
  if(/Android/.test(ua))return 'android';
  return 'desktop'}
async function installHelp(){
  if(DEFERRED){DEFERRED.prompt();const c=await DEFERRED.userChoice;DEFERRED=null;if(c&&c.outcome==='accepted')toast('Installed. Open IPO Hub from your home screen.');go();return}
  const env=installEnv(),addr=location.href.split('#')[0];
  const step=t=>`<div class="row"><div class="main" style="white-space:normal">${t}</div></div>`;
  const S={
    file:['This copy is opened from a file','A phone can only install IPO Hub from its web address. Upload the app to GitHub Pages, then open https://YOUR-USERNAME.github.io/ipo-hub/ in Chrome.',[]],
    inapp:['Open this page in Chrome first','You opened IPO Hub inside another app (like Viber or Messenger), which can’t install it.',['Tap the ⋮ or share menu in this window','Choose <b>Open in Chrome</b> (or Open in browser)','In Chrome, tap ⋮ then <b>Install app</b> or <b>Add to Home screen</b>']],
    android:['Install from Chrome’s menu','',['Tap the <b>⋮</b> menu at the top right of Chrome','Tap <b>Install app</b>. If you only see <b>Add to Home screen</b>, tap that and then <b>Install</b>','Open IPO Hub from your home screen']],
    samsung:['Install from Samsung Internet','',['Tap the <b>≡</b> menu at the bottom','Tap <b>Add page to</b>, then <b>Home screen</b>','Or open the same address in Chrome and use ⋮ then Install app']],
    ios:['Add to your Home Screen','iPhone can only do this from Safari.',['Open this page in <b>Safari</b>','Tap the <b>Share</b> button (square with an arrow)','Tap <b>Add to Home Screen</b>, then <b>Add</b>']],
    desktop:['Install on this computer','',['In Chrome or Edge, click the install icon at the right end of the address bar','Or open the ⋮ menu and choose <b>Install IPO Hub</b>','To use it on your phone, open the same address in Chrome on the phone']]
  }[env];
  await sheet({title:S[0],lead:S[1]||'',body:(S[2].length?`<div class="group">${S[2].map((t,n)=>step(`<b>${n+1}.</b> ${t}`)).join('')}</div>`:'')+
    (env!=='file'?`<div class="sec">This page’s address</div><div class="group"><div class="row"><div class="main s" style="white-space:normal;word-break:break-all">${esc(addr)}</div><button class="sbtn" data-a="${esc(addr)}" onclick="copyText(this.dataset.a).then(ok=>this.textContent=ok?'Copied':'Copy failed')">${IC.copy}Copy</button></div></div>`:''),
    actions:[{label:'Done'}]})}
function installBanner(){if(STANDALONE()||LS.get('ipohub_noinst'))return '';
  return `<div class="note info" id="instb">${IC.download}<div style="flex:1"><b>Install IPO Hub on this phone</b><br>Opens full screen from your home screen, like any other app.
   <div class="acts"><button class="sbtn" onclick="installHelp()">Install</button><button class="sbtn" style="background:none" onclick="LS.set('ipohub_noinst','1');$('#instb').remove()">Not now</button></div></div></div>`}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();DEFERRED=e;if(TAB==='acc'&&CACHE.acc)renderAcc()});
async function install(){return installHelp()}
window.addEventListener('online',()=>{const o=$('#off');if(o)o.hidden=true});
window.addEventListener('offline',()=>{const o=$('#off');if(o)o.hidden=false});
(function(){let y0=null,dy=0;
  addEventListener('touchstart',e=>{y0=(scrollY<=0&&!SHEET&&PASS)?e.touches[0].clientY:null;dy=0},{passive:true});
  addEventListener('touchmove',e=>{if(y0==null)return;dy=e.touches[0].clientY-y0;const p=$('#ptr');if(!p)return;
    if(dy>0){p.style.transition='none';p.style.height=Math.min(dy*.45,56)+'px';p.textContent=dy>90?'Release to refresh':'Pull to refresh'}},{passive:true});
  addEventListener('touchend',()=>{const p=$('#ptr');if(y0==null||!p)return;p.style.transition='';
    if(dy>90){p.textContent='Refreshing…';p.style.height='40px';vib(8);refresh().finally(()=>{p.style.height='0'})}else p.style.height='0';y0=null},{passive:true})})();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
if(PASS){shell();go()}else login();
</script>
</body>
</html>
